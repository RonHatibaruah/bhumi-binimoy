<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M50 5 L88 22 C88 58 50 92 50 92 C50 92 12 58 12 22 Z" 
        fill="url(#shieldGrad)" stroke="#10b981" stroke-width="3" filter="url(#glow)" />

  <!-- Inner Cadastral Land Grid / Polygon -->
  <polygon points="50,22 74,36 64,68 36,68 26,36" 
           fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3,2" />

  <!-- Central Land Contour Nodes -->
  <circle cx="50" cy="22" r="3" fill="#fbbf24" />
  <circle cx="74" cy="36" r="3" fill="#fbbf24" />
  <circle cx="64" cy="68" r="3" fill="#fbbf24" />
  <circle cx="36" cy="68" r="3" fill="#fbbf24" />
  <circle cx="26" cy="36" r="3" fill="#fbbf24" />

  <!-- Central Health Checkmark -->
  <path d="M38 48 L46 56 L64 36" 
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
